name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Billing/accounting engine tests gate every deploy (no dependencies:
      # Node's built-in test runner, preinstalled on the runner).
      - name: Run unit tests
        run: node --test tests/*.test.js
      # Cache-busting: stamp asset URLs with the commit SHA so browsers fetch
      # fresh app.js/app.css after every deploy instead of a stale cached copy.
      - name: Stamp asset version
        run: sed -i "s/__ASSET_V__/${GITHUB_SHA::7}/g" index.html
      # Server-side files have no business on the public site — the SQL
      # documents the schema and rate-limit internals; tests are dev-only.
      - name: Strip non-site files
        run: rm -rf supabase-migration*.sql tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
