<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F8F4EE;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}button,input{font-family:inherit}input::placeholder{color:#9A9187}a{color:#A84A15;text-decoration:none}a:hover{color:#B9531A}</style>
</helmet>
<div style="position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1F1B16">
  <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
    <sc-if value="{{ hasEyebrow }}" hint-placeholder-val="{{ false }}">
      <a href="{{ eyebrowHref }}" style="display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:#6E665D;text-decoration:none"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>{{ eyebrow }}</a>
    </sc-if>
    <h1 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-0.025em;line-height:1.15">{{ title }}</h1>
    <div style="font-size:14.5px;color:#6E665D">{{ subtitle }}</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;flex:none">
    <div style="position:relative;width:340px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:15px;top:13px;color:#9A9187"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
      <input onInput="{{ onSearch }}" placeholder="Search tenants, units or bills" style="width:100%;height:44px;border:1px solid #E4DCD1;border-radius:22px;background:#FFFFFF;padding:0 16px 0 42px;font-size:14px;color:#1F1B16;outline:none" style-focus="border-color:#E8772E;box-shadow:0 0 0 4px #FDEEE3">
      <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:0;right:0;top:52px;background:#FFFFFF;border:1px solid #ECE5DC;border-radius:16px;box-shadow:0 24px 48px -16px rgba(60,40,20,0.28);overflow:hidden">
          <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}"><div style="padding:18px;font-size:13.5px;color:#6E665D">Nothing matches “{{ query }}”.</div></sc-if>
          <sc-for list="{{ results }}" as="r" hint-placeholder-count="3">
            <a href="{{ r.href }}" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #F3EEE7;color:#1F1B16;text-decoration:none" style-hover="background:#FBF8F4;color:#1F1B16">
              <span style="{{ r.iconStyle }}">{{ r.ini }}</span>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.title }}</span><span style="font-size:12.5px;color:#6E665D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.sub }}</span></div>
              <span style="font-size:11px;font-weight:700;color:#9A9187;text-transform:uppercase;letter-spacing:0.06em">{{ r.kind }}</span>
            </a>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <div style="position:relative">
      <button onClick="{{ toggleBell }}" title="Notifications" style="width:44px;height:44px;border-radius:50%;border:1px solid #E4DCD1;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#4A433B;cursor:pointer;position:relative" style-hover="background:#FBF8F4">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#D9452F;color:#FFFFFF;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #F8F4EE">2</span>
      </button>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;right:0;top:54px;width:380px;background:#FFFFFF;border:1px solid #ECE5DC;border-radius:16px;box-shadow:0 24px 48px -16px rgba(60,40,20,0.28);overflow:hidden">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px"><span style="font-size:15px;font-weight:700">Notifications</span><span style="font-size:12.5px;color:#6E665D">Due today and newly overdue</span></div>
          <sc-for list="{{ notes }}" as="n" hint-placeholder-count="2">
            <div style="display:flex;gap:12px;padding:14px 18px;border-top:1px solid #F3EEE7">
              <span style="{{ n.iconStyle }}"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg></span>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
                <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:13.5px;font-weight:700">{{ n.title }}</span><span style="font-size:12px;color:#6E665D;white-space:nowrap">{{ n.when }}</span></div>
                <span style="font-size:13px;color:#4A433B;line-height:1.45">{{ n.body }}</span>
              </div>
            </div>
          </sc-for>
          <a href="Billing.dc.html" style="display:flex;justify-content:center;padding:13px;border-top:1px solid #F3EEE7;font-size:13.5px;font-weight:700;color:#A84A15;background:#FEF7F1;text-decoration:none">View open bills</a>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:360},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Good morning&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Friday, 2 October&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrowHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bellOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: null, q: '' };
  renderVals() {
    const open = this.state.open ?? !!this.props.bellOpen;
    const avPal = [['#FDEEE3', '#A84A15'], ['#E8F0FB', '#2C62B0'], ['#E6F4EC', '#1E7A52'], ['#F1EAFB', '#6A46B0'], ['#FFF3DA', '#8A5508'], ['#E3F1F2', '#1D6B73']];
    const avS = (name) => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 1009; const p = avPal[h % avPal.length]; return { width: '34px', height: '34px', borderRadius: '50%', background: p[0], color: p[1], display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', fontWeight: 700, flex: 'none' }; };
    const ini = n => { const w = n.split(' '); return (w[0][0] + w[w.length - 1][0]).toUpperCase(); };
    const billIc = { width: '34px', height: '34px', borderRadius: '10px', background: '#F5F0EA', color: '#4A433B', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', fontWeight: 700, flex: 'none' };
    const people = [
      ['Liza Bautista', '102', '1st floor', 'LB4Q7T', '₱6,500 overdue'], ['Carlo Mendoza', '103', '1st floor', 'CM8R2K', 'paid ahead'], ['Ana Villanueva', '105', '1st floor', 'AV2M9P', 'settled'],
      ['Ramon dela Cruz', '204', '2nd floor', 'RD7X3N', '₱7,800 overdue'], ['Grace Lim', '206', '2nd floor', 'GL5T8W', 'settled'], ['Maria Santos', '301', '3rd floor', 'MS3K9D', '₱7,000 due today'],
      ['Jun Reyes', '303', '3rd floor', 'JR6P2L', '₱6,500 due Oct 4'], ['Paolo Garcia', '304', '3rd floor', 'PG9W4H', 'paid ahead']
    ].map(([n, u, f, c, s]) => ({ kind: 'Tenant', title: n, sub: 'Unit ' + u + ' · ' + f + ' · ' + s, key: [n, u, c].join(' '), href: 'Tenant Detail.dc.html', ini: ini(n), iconStyle: avS(n) }));
    const bills = [
      ['Rent – September', 'Ramon dela Cruz · Unit 204 · ₱6,500 · 27 days late'], ['Electricity – September', 'Ramon dela Cruz · Unit 204 · ₱1,300 · 12 days late'],
      ['Rent – October', 'Liza Bautista · Unit 102 · ₱6,500 · 4 days late'], ['Rent – October', 'Maria Santos · Unit 301 · ₱6,500 · due today'],
      ['Rent – October', 'Jun Reyes · Unit 303 · ₱6,500 · due Oct 4'], ['Water – September', 'Maria Santos · Unit 301 · ₱500 · due Oct 5']
    ].map(([t, s]) => ({ kind: 'Bill', title: t, sub: s, key: t + ' ' + s, href: 'Billing.dc.html', ini: '₱', iconStyle: billIc }));
    const q = this.state.q.trim().toLowerCase();
    const results = q ? people.concat(bills).filter(r => r.key.toLowerCase().includes(q)).slice(0, 6) : [];
    const search = { hasQuery: !!q, query: this.state.q.trim(), results, noResults: !!q && !results.length, onSearch: e => this.setState({ q: e.target.value, open: false }) };
    const ic = (bg, fg) => ({ width: '34px', height: '34px', borderRadius: '10px', background: bg, color: fg, display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' });
    return {
      ...search,
      title: this.props.title ?? 'Dashboard',
      subtitle: this.props.subtitle ?? '',
      eyebrow: this.props.eyebrow ?? '',
      eyebrowHref: this.props.eyebrowHref ?? '#',
      hasEyebrow: !!this.props.eyebrow,
      open,
      toggleBell: () => this.setState({ open: !open }),
      notes: [
        { title: 'Rent due today', when: 'Today', body: 'Maria Santos · Unit 301 · Rent – October · ₱6,500', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2', iconStyle: ic('#FFF3DA', '#94590A') },
        { title: 'Now overdue', when: '2 days ago', body: 'Liza Bautista · Unit 102 · Rent – October · ₱6,500', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 8v4M12 16h.01', iconStyle: ic('#FDECEA', '#C2362B') }
      ]
    };
  }
}
</script>
</body>
</html>
