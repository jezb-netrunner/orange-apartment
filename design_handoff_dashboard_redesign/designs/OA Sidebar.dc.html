<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F8F4EE;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}button{font-family:inherit}a{color:#A84A15;text-decoration:none}a:hover{color:#B9531A}</style>
</helmet>
<aside style="width:256px;height:100%;min-height:100%;background:#FFFFFF;border-right:1px solid #ECE5DC;padding:24px 18px 20px;display:flex;flex-direction:column;gap:24px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1F1B16">
  <div style="display:flex;align-items:center;gap:11px;padding:0 6px">
    <span style="width:36px;height:36px;border-radius:11px;background:#E8772E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex:none">O</span>
    <div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:15px;font-weight:700;letter-spacing:-0.01em">Orange Apartment</span><span style="font-size:12px;color:#6E665D">Property admin</span></div>
  </div>
  <a href="Receive Payment.dc.html" style="height:44px;border-radius:11px;background:#B9531A;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;text-decoration:none" style-hover="background:#9F4614;color:#FFFFFF"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7h20v10H2zM12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM6 12h.01M18 12h.01"></path></svg>Receive payment</a>
  <nav style="display:flex;flex-direction:column;gap:3px">
    <div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A9187;padding:0 12px 8px">Menu</div>
    <sc-for list="{{ main }}" as="n" hint-placeholder-count="4">
      <a href="{{ n.href }}" style="{{ n.style }}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg><span style="flex:1">{{ n.label }}</span><sc-if value="{{ n.hasCount }}" hint-placeholder-val="{{ false }}"><span style="{{ n.countStyle }}">{{ n.count }}</span></sc-if></a>
    </sc-for>
    <div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A9187;padding:22px 12px 8px">Analyze</div>
    <sc-for list="{{ more }}" as="n" hint-placeholder-count="2">
      <a href="{{ n.href }}" style="{{ n.style }}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg><span style="flex:1">{{ n.label }}</span></a>
    </sc-for>
  </nav>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #F0EAE2;border-radius:14px">
      <span style="width:38px;height:38px;border-radius:50%;background:#FDEEE3;color:#A84A15;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none">OW</span>
      <div style="display:flex;flex-direction:column;min-width:0;flex:1"><span style="font-size:13.5px;font-weight:700">Owner</span><span style="font-size:12px;color:#6E665D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">owner@orange-apartment.com</span></div>
      <button title="Sign out" style="width:32px;height:32px;border:none;border-radius:9px;background:transparent;color:#6E665D;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none" style-hover="background:#F7F2EC"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></button>
    </div>
    <div style="font-size:11px;color:#9A9187;padding:0 10px">Powered by JEZ</div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;tenants&quot;,&quot;billing&quot;,&quot;expenses&quot;,&quot;reports&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const item = (key, label, href, d, count, alert) => {
      const on = key === active;
      return {
        label, href, d, hasCount: !!count, count: count || '',
        style: { display: 'flex', alignItems: 'center', gap: '12px', height: '44px', padding: '0 12px', borderRadius: '11px', textDecoration: 'none', fontSize: '14px', fontWeight: on ? 700 : 500, color: on ? '#A84A15' : '#4A433B', background: on ? '#FDEEE3' : 'transparent' },
        countStyle: alert
          ? { minWidth: '22px', height: '22px', padding: '0 7px', borderRadius: '11px', background: '#FDECEA', color: '#C2362B', fontSize: '12px', fontWeight: 700, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }
          : { fontSize: '12.5px', fontWeight: 600, color: '#9A9187' }
      };
    };
    return {
      main: [
        item('dashboard', 'Dashboard', 'Dashboard.dc.html', 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z'),
        item('tenants', 'Tenants', 'Tenants.dc.html', 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75', '8'),
        item('billing', 'Billing', 'Billing.dc.html', 'M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6M9 16h4', '3', true),
        item('expenses', 'Expenses', 'Expenses.dc.html', 'M3 7a2 2 0 0 1 2-2h13v4M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14h.01')
      ],
      more: [
        item('reports', 'Reports & insights', 'Reports.dc.html', 'M3 3v18h18M7 15l4-4 3 3 5-6'),
        item('settings', 'Settings', 'Settings.dc.html', 'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4')
      ]
    };
  }
}
</script>
</body>
</html>
